# Parameters below are implementation defaults; the supplied paper omits its appendix.
name: qmix_rpg
mac: rpg_mac
agent: rpg
learner: rpg_learner
mixer: rpg_qmix
device: cpu
seed: 0
torch_threads: 1
agent_output_type: q
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
test_greedy: true
obs_last_action: true
obs_agent_id: false
rnn_hidden_dim: 64
entity_embed_dim: 64
attn_embed_dim: 32
mixing_embed_dim: 32
rpg_task_embed_dim: 32
rpg_hyper_hidden_dim: 64
rpg_head_hidden_dim: 64
rpg_mixer_heads: 4
rpg_embedding_std: 1.0
rpg_alpha_init: 0.5
rpg_alpha_att: 0.001
rpg_lambda_rc: 100.0
rpg_lambda_hy: 0.01
rpg_importance_samples: 32
rpg_return_probe_episodes: 16
gamma: 0.99
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 10
double_q: true
target_update_interval: 200
batch_size: 32
buffer_size: 256
learner_log_interval: 2000
test_interval: 10000
test_nepisode: 32
updates_per_episode: 1
# gamma_p uses clipped (episode_return - min)/(max-min), not task success labels.
return_min: 0.0
return_max: 1.0
